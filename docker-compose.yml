services:
    backend:
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
        container_name: shelter-os-backend
        ports:
            - "4000:4000"
        env_file:
            - .env
        restart: unless-stopped

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        container_name: shelter-os-web
        ports:
            - "3000:3000"
        env_file:
            - .env
        depends_on:
            - backend
        restart: unless-stopped

    admin:
        build:
            context: .
            dockerfile: apps/admin/Dockerfile
        container_name: shelter-os-admin
        ports:
            - "3001:3001"
        env_file:
            - .env
        depends_on:
            - backend
        restart: unless-stopped
